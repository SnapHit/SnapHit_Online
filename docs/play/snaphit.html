  ctx.strokeStyle = 'rgba(255,148,36,0.75)'; ctx.lineWidth = 2.4 * hub.s; stick();
  ctx.lineCap = 'butt';

  // the ball
  const sp = joyBall();
  const B = proj(JOY.x + JOY.tx, JOY.y + JOY.ty, topZ + JOY.ballR * 0.55);
  const sc = (JOY.ballR / sp.r) * B.s * (1 + JOY.flare * 0.14);
  const w = sp.cw * sc;
  if (JOY.flare > 0){
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = JOY.flare * 0.7;
    ctx.drawImage(sp.canvas, B.x - w/2, B.y - w/2, w, w);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
  ctx.drawImage(sp.canvas, B.x - w/2, B.y - w/2, w, w);
}

function drawRails(){
  ctx.globalCompositeOperation = 'lighter';
  for (const r of RAILS){
    const y = r.fy * FIELD.depth, hw = FIELD.halfW;
    const a = proj(-hw, y, r.z), b = proj(hw, y, r.z);
    ctx.globalAlpha = 0.30;
    ctx.strokeStyle = PAL.gridHot; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.globalAlpha = 0.5;
    for (const e of [[-hw, a], [hw, b]]){
      const foot = proj(e[0], y, 0);
      ctx.strokeStyle = PAL.edge; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(e[1].x, e[1].y); ctx.lineTo(foot.x, foot.y); ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawDuck(d){
  const sp = duckSprite();
  const p = proj(d.x, d.y, d.z + K.DUCK_H * 0.5);
  if (p.d < 40) return;
  const sc = (K.DUCK_H / (sp.ch * 0.58)) * p.s;
  const w = sp.cw * sc, h = sp.ch * sc;

  if (d.alive){
    const e = groundEllipse(d.x, d.y, 0, K.DUCK_R * 0.9);   // shadow on the floor
    ctx.globalAlpha = 0.26;
    ctx.fillStyle = '#000814';
    ctx.beginPath(); ctx.ellipse(e.x, e.y, e.rx, Math.max(2, e.ry*1.5), 0, 0, 6.284); ctx.fill();
  }

  ctx.save();
  ctx.globalAlpha = d.alive ? 1 : Math.max(0, d.fade);
  ctx.translate(p.x, p.y);
  if (d.rot) ctx.rotate(d.rot);
  if (d.dir < 0) ctx.scale(-1, 1);
  ctx.drawImage(sp.canvas, -w/2, -h/2, w, h);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawShadow(b){
  const air = b.z - b.sup;
  const lift = clamp(1 - air / 300, 0.22, 1);
  const e = groundEllipse(b.x, b.y, b.sup, b.ehw * 0.95 + air * 0.25);
  ctx.globalAlpha = 0.36 * lift * (b.dying ? b.dying / 0.9 : 1);
  ctx.fillStyle = '#000814';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y, e.rx, Math.max(2, e.ry * 1.5), 0, 0, 6.284);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawRings(){
  ctx.globalCompositeOperation = 'lighter';
  for (const r of rings){
    const k = 1 - r.t / r.life;
    const e = groundEllipse(r.x, r.y, r.z, r.max * k);
    ctx.globalAlpha = (1 - k) * 0.55;
    ctx.strokeStyle = r.col; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(e.x, e.y, e.rx, Math.max(1, e.ry * 1.5), 0, 0, 6.284);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawLinks(){
  if (!links.length) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const l of links){
    const pa = proj(l.a.x, l.a.y, l.a.z + l.a.hgt * 0.5);
    const pb = proj(l.b.x, l.b.y, l.b.z + l.b.hgt * 0.5);
    const W = WORDS[l.a.wi];
    ctx.globalAlpha = 0.10 + l.k * 0.55;
    ctx.strokeStyle = W.body; ctx.lineWidth = 1 + l.k * 4;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    ctx.globalAlpha = 0.25 + l.k * 0.6;
    ctx.strokeStyle = W.core; ctx.lineWidth = 0.8 + l.k * 1.4;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawParticles(){
  ctx.globalCompositeOperation = 'lighter';
  let lf = null, la = -1;
  const fill = c => { if (c !== lf){ ctx.fillStyle = c; lf = c; } };
  const alpha = a => { const q = (a * 32 | 0) / 32; if (q !== la){ ctx.globalAlpha = q; la = q; } };
  for (const p of particles){
    const q = proj(p.x, p.y, p.z);
    const u = clamp(p.t / p.life, 0, 1);
    const k = p.k || 0;

    if (k === 1){                                   // spark: hot, tiny, cooling
      alpha(u);
      fill(SPARK_RAMP[Math.min(6, ((1 - u) * 7) | 0)]);
      const r = Math.max(0.8, p.r * q.s);
      ctx.fillRect(q.x - r, q.y - r * 0.7, r * 2, r * 1.4);
      continue;
    }
    if (k === 2){                                   // fire: swelling, cooling
      alpha(u * u * 0.7);
      fill(FIRE_RAMP[Math.min(6, ((1 - u) * 7) | 0)]);
      ctx.beginPath();
      ctx.arc(q.x, q.y, Math.max(1, p.r * (0.5 + (1 - u) * 2.1) * q.s), 0, 6.284);
      ctx.fill();
      continue;
    }
    if (k === 4){                                   // confetti flake
      ctx.globalAlpha = Math.min(1, u * 3);
      ctx.fillStyle = p.col;
      const w = Math.max(1, p.r * q.s * 1.6);
      const h = Math.max(0.6, w * p.ar * Math.abs(Math.cos(p.flip)) + 0.5);
      ctx.fillRect(q.x - w * 0.5, q.y - h * 0.5, w, h);
      continue;
    }
    if (k === 3){                                   // firework star, twinkling
      alpha(u * (0.65 + 0.35 * Math.sin(clock * 47 + p.r * 9)));
      fill(p.col);
      ctx.beginPath();
      ctx.arc(q.x, q.y, Math.max(0.8, p.r * q.s), 0, 6.284);
      ctx.fill();
      continue;
    }
    alpha(u * 0.9);
    fill(p.col);
    ctx.beginPath();
    ctx.arc(q.x, q.y, Math.max(0.7, p.r * q.s), 0, 6.284);
    ctx.fill();
  }

  for (const s of shells){                          // the rising shell itself
    const q = proj(s.x, s.y, s.z);
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = s.col;
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(1.6, 4 * q.s), 0, 6.284); ctx.fill();
    ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(q.x, q.y, Math.max(3, 10 * q.s), 0, 6.284); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawTrajectory(){
  if (finale) return;
  const pts = traj();
  if (pts.length < 2) return;
  const hot = pull.on || pull.keys;

  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < pts.length; i += 3){
    const p = pts[i], q = proj(p.x, p.y, p.z);
    const k = i / pts.length;
    ctx.globalAlpha = (hot ? 0.8 : 0.26) * (1 - k * 0.5);
    ctx.fillStyle = hot ? PAL.edgeCore : PAL.gridHot;
    ctx.beginPath();
    ctx.arc(q.x, q.y, Math.max(1.1, (hot ? 3.6 : 2.2) * q.s), 0, 6.284);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  const last = pts[pts.length - 1];
  const e = groundEllipse(last.x, last.y, last.z, 64);
  ctx.globalAlpha = hot ? 0.9 : 0.32;
  ctx.strokeStyle = hot ? PAL.edge : PAL.gridHot; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(e.x, e.y, e.rx, Math.max(2, e.ry * 1.5), 0, 0, 6.284);
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function drawSling(){
  if (finale) return;
  const base = proj(0, SLING_Y, 0);
  const e = groundEllipse(0, SLING_Y, 0, 74);
  ctx.globalAlpha = 0.9;
  ctx.fillStyle = '#0a1626';
  ctx.beginPath();
  ctx.ellipse(e.x, e.y, e.rx, Math.max(3, e.ry * 1.5), 0, 0, 6.284);
  ctx.fill();
  ctx.shadowColor = PAL.edge; ctx.shadowBlur = 20;
  ctx.strokeStyle = PAL.edge; ctx.lineWidth = 2.4;
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  const L  = proj(-SLING.postX, SLING_Y, SLING.postH);
  const R  = proj( SLING.postX, SLING_Y, SLING.postH);
  const Lb = proj(-SLING.postX, SLING_Y, 0);
  const Rb = proj( SLING.postX, SLING_Y, 0);
  const p  = pouchPos();
  const P  = proj(p.x, p.y, p.z);
  const W  = WORDS[upcoming];

  ctx.lineCap = 'round';
  ctx.strokeStyle = '#12233a'; ctx.lineWidth = 11 * base.s;
  ctx.beginPath();
  ctx.moveTo(Lb.x, Lb.y); ctx.lineTo(L.x, L.y);
  ctx.moveTo(Rb.x, Rb.y); ctx.lineTo(R.x, R.y);
  ctx.stroke();
  ctx.shadowColor = PAL.edge; ctx.shadowBlur = 12;
  ctx.strokeStyle = PAL.edge; ctx.lineWidth = 4 * base.s;
  ctx.beginPath();
  ctx.moveTo(Lb.x, Lb.y); ctx.lineTo(L.x, L.y);
  ctx.moveTo(Rb.x, Rb.y); ctx.lineTo(R.x, R.y);
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.globalAlpha = 0.55 + power * 0.45;
  ctx.strokeStyle = W.body; ctx.lineWidth = (1.6 + power * 2.4) * base.s;
  ctx.beginPath();
  ctx.moveTo(L.x, L.y); ctx.lineTo(P.x, P.y); ctx.lineTo(R.x, R.y);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.lineCap = 'butt';

  const sp = sprite(upcoming, 1);
  const s = (K.SIZE_BASE * 0.62 / sp.px) * P.s;
  ctx.globalAlpha = 0.97;
  ctx.drawImage(sp.canvas, P.x - sp.cw*s/2, P.y - sp.ch*s/2, sp.cw*s, sp.ch*s);
  ctx.globalAlpha = 1;

  if (pull.on){
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = PAL.edgeCore; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.arc(pull.ax, pull.ay, 13, 0, 6.284); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pull.ax, pull.ay); ctx.lineTo(pull.x, pull.y); ctx.stroke();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = PAL.edgeCore;
    ctx.beginPath(); ctx.arc(pull.x, pull.y, 4 + power * 5, 0, 6.284); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let popFs = -1;
function drawPops(){
  popFs = -1;
  for (const p of pops){
    const k = 1 - p.t / p.life;
    const q = proj(p.x, p.y, p.z + k * 110);
    ctx.globalAlpha = clamp(p.t / p.life, 0, 1);
    const fs = Math.max(10, Math.round(22 * q.s));
    if (fs !== popFs){ ctx.font = '700 ' + fs + 'px system-ui,sans-serif'; popFs = fs; }
    ctx.textAlign = 'center';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(6,14,24,0.85)';
    ctx.lineWidth = Math.max(2, 4 * q.s);
    ctx.strokeText(p.txt, q.x, q.y);
    ctx.fillStyle = p.col;
    ctx.fillText(p.txt, q.x, q.y);
  }
  ctx.globalAlpha = 1;
}

function drawUI(){
  /* Sound control, top left. It was a 22% alpha glyph in a corner and
     nobody found it, so until it has been used once it is a labelled pill
     that breathes. After that it settles down to a quiet icon. */
  const pad = 12, sx = 14 + SAFE.l, sy = 14 + SAFE.t;
  const label = SFX.on ? 'SOUND ON' : 'SOUND OFF';
  const shy = SFX.touched;
  const fs = shy ? 9 : 10;
  ctx.font = '800 ' + fs + 'px system-ui,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '1.6px';
  const tw = ctx.measureText(label).width;
  const h = shy ? 26 : 30, w = 22 + tw + pad * 2;
  const cy = sy + h / 2;
  const breathe = shy ? 1 : 0.72 + 0.28 * Math.abs(Math.sin(clock * 1.7));

  ctx.globalAlpha = (shy ? 0.34 : 0.60) * breathe;
  ctx.fillStyle = 'rgba(6,14,26,0.72)';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(sx, sy, w, h, h / 2);
  else ctx.rect(sx, sy, w, h);
  ctx.fill();
  ctx.lineWidth = 1.1;
  ctx.strokeStyle = SFX.on ? PAL.edge : '#7fb6dd';
  ctx.stroke();

  const gx = sx + pad + 5, gy = cy;
  ctx.globalAlpha = (shy ? 0.55 : 0.95) * breathe;
  ctx.fillStyle = ctx.strokeStyle = SFX.on ? PAL.edgeCore : '#bcd9f0';
  ctx.lineWidth = 1.3; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(gx - 6, gy - 2.5); ctx.lineTo(gx - 3, gy - 2.5); ctx.lineTo(gx + 1, gy - 6);
  ctx.lineTo(gx + 1, gy + 6); ctx.lineTo(gx - 3, gy + 2.5); ctx.lineTo(gx - 6, gy + 2.5);
  ctx.closePath(); ctx.fill();
  if (SFX.on){
    ctx.beginPath(); ctx.arc(gx + 1.5, gy, 4.6, -0.85, 0.85); ctx.stroke();
    ctx.beginPath(); ctx.arc(gx + 1.5, gy, 7.6, -0.85, 0.85); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.moveTo(gx + 4, gy - 3.4); ctx.lineTo(gx + 9, gy + 3.4);
    ctx.moveTo(gx + 9, gy - 3.4); ctx.lineTo(gx + 4, gy + 3.4);
    ctx.stroke();
  }
  ctx.fillText(label, sx + pad + 20, cy + 0.5);
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '0px';
  SFX.hit = { x: sx, y: sy, w, h };

  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = '#9fd8ff'; ctx.lineWidth = 1.4;
  const rx = VW - 30 - SAFE.r, ry = 30 + SAFE.t;
  ctx.beginPath(); ctx.arc(rx, ry, 9, 0.6, 5.4); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(rx + 6, ry - 8); ctx.lineTo(rx + 8.5, ry - 1); ctx.lineTo(rx + 1, ry - 2.5);
  ctx.closePath();
  ctx.fillStyle = '#9fd8ff'; ctx.fill();
  ctx.globalAlpha = 1;
}


/* A full screen additive wash on a big hit. Skipped below the quality
   threshold, because it is a whole screen of fill for a frame or two. */
function drawFlash(){
  if (flash <= (quality ? 0.002 : 0.14)) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = Math.min(1, flash) * 0.55;
  ctx.fillStyle = GRAD.flash;
  ctx.fillRect(0, 0, VW, VH);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

/* The studio mark, in canvas. Same geometry as the SVG in the footer. */
function drawGlyph(cx, cy, h, alpha){
  const k = h / 60, X = v => cx + (v - 32) * k, Y = v => cy + (v - 30) * k;
  const ring = (rx, ry) => { ctx.beginPath();
    ctx.ellipse(X(32), Y(46), rx * k, ry * k, 0, 0, 6.284); ctx.stroke(); };
  const stem = () => { ctx.beginPath();
    ctx.moveTo(X(32), Y(43.5)); ctx.lineTo(X(32), Y(25)); ctx.stroke(); };
  const ball = () => { ctx.beginPath();
    ctx.arc(X(32), Y(17), 8.5 * k, 0, 6.284); ctx.stroke(); };
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#00e5ff';
  ctx.globalAlpha = alpha * 0.28; ctx.lineWidth = 6 * k;
  ring(21, 7.5); stem(); ball();
  ctx.globalAlpha = alpha; ctx.lineWidth = 2.2 * k;
  ring(21, 7.5); stem(); ball();
  ctx.globalAlpha = alpha * 0.55; ring(11, 3.9);
  ctx.restore();
  ctx.globalAlpha = 1;
}

function drawFinaleText(){
  if (!finale || finale.phase === 'charge' || finale.phase === 'chain') return;
  const rev = finale.rev || 0;
  // four lines, revealed one after another, then held
  const out = 1;
  const f0 = clamp((rev - 0.15) / 0.90, 0, 1) * out;   // the mark
  const fa = clamp((rev - 0.75) / 1.05, 0, 1) * out;   // WELCOME TO
  const fb = clamp((rev - 1.35) / 1.35, 0, 1) * out;   // SNAPHIT
  const fc = clamp((rev - 2.75) / 1.00, 0, 1) * out;   // STUDIOS
  const fd = clamp((rev - 3.70) / 1.15, 0, 1) * out;   // INSTANT PLAY
  if (f0 <= 0.001) return;

  ctx.textAlign = 'center';
  ctx.lineJoin = 'round';

  // Real tracking keeps the full stops attached to the words they end.
  const track = ('letterSpacing' in ctx);
  const line = (txt, px, base, alpha, spread) => {
    if (alpha <= 0.001) return;
    let size = px;
    const set = () => {
      ctx.font = '800 ' + size + 'px system-ui,"Segoe UI",Roboto,sans-serif';
      if (track){
        ctx.letterSpacing = (size * 0.26).toFixed(2) + 'px';
        ctx.wordSpacing   = (size * 0.55).toFixed(2) + 'px';
      }
    };
    set();
    const w = ctx.measureText(txt).width;
    if (w > VW * spread){ size = Math.max(9, Math.floor(size * VW * spread / w)); set(); }
    ctx.globalAlpha = alpha;
    ctx.shadowColor = PAL.edge; ctx.shadowBlur = 22;
    ctx.fillStyle = PAL.edge;
    ctx.fillText(txt, VW/2, base);
    ctx.shadowBlur = 0;
    ctx.fillStyle = PAL.edgeCore;
    ctx.fillText(txt, VW/2, base);
    if (track){ ctx.letterSpacing = '0px'; ctx.wordSpacing = '0px'; }
  };

  const s1  = Math.round(Math.min(VW * 0.040, VH * 0.023));
  const sSt = Math.round(Math.min(VW * 0.050, VH * 0.028));
  const s3  = Math.round(Math.min(VW * 0.038, VH * 0.022));

  // block = glyph, WELCOME TO, wordmark, STUDIOS, tagline. Everything but the
  // wordmark is viewport derived, so its height solves in one step.
  const deckFar = proj(0, FIELD.depth, 0).y;
  const room = (deckFar - 16) * 0.92;
  const fixed = s1 * 2.3 + sSt * 2.9 + s3;
  let wmH = Math.min((VW * 0.66) / WM.ratio, (room - fixed) / 2.63);
  wmH = Math.max(10, wmH);

  const gh = wmH * 0.95;
  const H  = wmH * 2.63 + fixed;
  const top = clamp(deckFar * 0.5 - H / 2, 6, VH * 0.45);

  if (f0 > 0.001) drawGlyph(VW / 2, top + gh / 2, gh * (1 + 0.22 * (1 - f0)), f0);

  const y   = top + gh + s1 * 1.3 + s1;
  const wmY = y + wmH * 0.30 + wmH / 2;
  const ySt = wmY + wmH * 0.50 + wmH * 0.38 + sSt;

  line(track ? 'WELCOME TO' : 'W E L C O M E   T O', s1, y, fa, 0.46);

  if (fb > 0.001){
    const grow = 1 + 0.22 * Math.pow(1 - fb, 2);
    const h = wmH * grow;
    const lw = Math.max(1, h * 0.055);
    strokeWordmark(VW/2, wmY, h, lw, PAL.edge, fb * 0.34, h * (0.20 + 0.20 * (1 - fb)));
    strokeWordmark(VW/2, wmY, h, lw, PAL.edge, fb * 0.85, h * 0.09);
    strokeWordmark(VW/2, wmY, h, lw, PAL.edgeCore, fb, 0);
  }

  line(track ? 'STUDIOS' : 'S T U D I O S', sSt, ySt, fc, 0.56);
  line(track ? 'INSTANT. PLAY.' : 'I N S T A N T.  P L A Y.', s3, ySt + sSt * 1.9, fd, 0.60);

  ctx.globalAlpha = 1;

  if (finale.phase === 'done'){
    const s4 = Math.round(Math.min(VW * 0.030, VH * 0.017));
    ctx.font = '700 ' + s4 + 'px system-ui,"Segoe UI",Roboto,sans-serif';
    ctx.globalAlpha = 0.30 + 0.30 * Math.abs(Math.sin(clock * 1.8));
    ctx.fillStyle = '#bfe6ff';
    ctx.fillText('T A P   T O   P L A Y   A G A I N', VW/2, VH - 34 - SAFE.b);
  }
  ctx.globalAlpha = 1;
}

function drawVignette(){
  ctx.fillStyle = GRAD.vignette;
  ctx.fillRect(0, 0, VW, VH);
}

/* Sky, galaxy, grid, dust, deck, rails and vignette all move slowly or not at
   all. They are painted onto a plate a few times a second and blitted after
   that, which collapses roughly five full-screen fills per frame into one. */
/* Live stars are what make the drift smooth, and they cost a second
   composite. Keep them while there is headroom; fold them back onto the
   plate on a device that has already had to give up resolution. */
let smoothStars = true;
function starsAreLive(){ return smoothStars; }

function paintSky(){
  const main = ctx, P = K.BG_PAD;
  ctx = bgx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.translate(P, P);
  drawBackdrop();
  drawMotes(1 / 15);
  if (!starsAreLive()){
    drawStars();
    if (fgDirty) { ctx = main; paintDeck(); ctx = bgx; ctx.setTransform(DPR,0,0,DPR,0,0); ctx.translate(P,P); }
    ctx.drawImage(fg, -P, -P, VW + 2 * P, VH + 2 * P);
  }
  ctx = main;
  bgFrame = 0;
  bgDirty = false;
}

function paintDeck(){
  const main = ctx, P = K.BG_PAD;
  ctx = fgx;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(-P, -P, VW + 2 * P, VH + 2 * P);
  ctx.translate(P, P);
  drawGrid();
  drawField();
  drawRails();
  drawVignette();
  ctx = main;
  fgDirty = false;
}

function draw(){
  if (bgDirty || ++bgFrame >= (smoothStars ? 7 : 2)) paintSky();
  if (fgDirty) paintDeck();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (shake > 0.2) ctx.translate(rnd(-shake, shake), rnd(-shake, shake) * 0.6);
  const P2 = K.BG_PAD, W2 = VW + 2 * P2, H2 = VH + 2 * P2;
  ctx.drawImage(bg, -P2, -P2, W2, H2);
  if (starsAreLive()){
    drawStars();
    ctx.drawImage(fg, -P2, -P2, W2, H2);
  }
  drawEdgeFlash();
  drawRings();

  // one depth-sorted pass over words and arena blocks, by nearest edge
  const scene = [];
  for (const o of blocks) scene.push({ o, key: proj(o.x, o.y - o.ehd, 0).d });
  for (const b of bodies) scene.push({ b, key: proj(b.x, b.y - b.ehd, 0).d });
  for (const d of ducks)  scene.push({ d, key: proj(d.x, d.y - K.DUCK_R, 0).d });
  scene.push({ j: 1, key: proj(JOY.x, JOY.y - JOY.r, 0).d });
  scene.sort((p, q) => q.key - p.key);

  for (const it of scene){
    if (it.o){ drawBlock(it.o); continue; }
    if (it.d){ drawDuck(it.d); continue; }
    if (it.j){ drawJoy(); continue; }
    const b = it.b, a = b.dying ? b.dying / 0.9 : 1;
    if (quality && b.z <= b.sup + 3) drawWord(b, 0.16 * a, true);
    drawShadow(b);
    drawWord(b, a, false);
  }

  drawLinks();
  drawParticles();
  drawTrajectory();
  drawSling();
  drawPops();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawFlash();
  drawFinaleText();
  drawUI();
}

/* ------------------------------------------------------------
   Host bridge. When this runs inside the site it tells the page
   when the run is cleared, and parks itself when scrolled away.
   ------------------------------------------------------------ */
const FRAMED = (() => { try { return window.parent !== window; } catch(e){ return false; } })();
let running = true;
function tellHost(what){
  if (!FRAMED) return;
  try { parent.postMessage({ snaphit: what }, '*'); } catch(e){}
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ running = false; SFX.suspend(); }
  else { running = true; last = 0; SFX.resume(); }
});
addEventListener('message', e => {
  const m = e.data && e.data.snaphit;
  if (m === 'pause'){ running = false; SFX.suspend(); }
  else if (m === 'resume'){ running = true; last = 0; SFX.resume(); }
});


/* ------------------------------------------------------------------
   Sound. Entirely synthesised: oscillators, filtered noise, saturation
   and a generated reverb. No sample files, no fetch, no external
   request of any kind.

   OFF UNTIL ASKED. This game sits on a page with other games and plays
   by itself the moment it loads, so noise by default would be rude.
   The AudioContext is not created until the control is tapped.
   ------------------------------------------------------------------ */
const SFX = {
  ac: null, bus: null, wet: null, sat: null, noise: null, ir: null,
  on: false, ready: false, touched: false, voices: 0, last: 0, lastBoom: -9,

  load(){
    // On unless it has been turned off. A browser will not let anything
    // sound before a gesture anyway, so the first tap is the real switch.
    try {
      const v = localStorage.getItem('snaphit_sound');
      this.on = v !== '0';
      this.touched = v !== null;
    } catch (e){ this.on = true; }
  },

  /* Called on the first pointer event of any kind, since that is the
     earliest a browser will allow an AudioContext to start. */
  wake(){
    if (!this.on || this.ready) { this.resume(); return; }
    this.boot(); this.resume();
  },
  save(){
    try { localStorage.setItem('snaphit_sound', this.on ? '1' : '0'); } catch (e){}
  },

  boot(){
    if (this.ready) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      const ac = this.ac = new AC();

      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 10;
      comp.attack.value = 0.002; comp.release.value = 0.25;
      comp.connect(ac.destination);

      this.bus = ac.createGain(); this.bus.gain.value = 0.8;
      this.bus.connect(comp);

      // A real explosion is mostly the room answering it. One short
      // generated impulse response, shared by everything.
      const dur = 1.5, n = Math.floor(ac.sampleRate * dur);
      const ir = ac.createBuffer(2, n, ac.sampleRate);
      for (let c = 0; c < 2; c++){
        const d = ir.getChannelData(c);
        for (let i = 0; i < n; i++){
          const decay = Math.pow(1 - i / n, 2.6);
          d[i] = (Math.random() * 2 - 1) * decay * (i < 400 ? i / 400 : 1);
        }
      }
      const conv = ac.createConvolver(); conv.buffer = ir;
      const tame = ac.createBiquadFilter();
      tame.type = 'lowpass'; tame.frequency.value = 4200;
      this.wet = ac.createGain(); this.wet.gain.value = 1;
      this.wet.connect(conv); conv.connect(tame); tame.connect(this.bus);

      // soft clip, so the loud parts grit up the way loud things do
      const sat = this.sat = ac.createWaveShaper();
      const curve = new Float32Array(1024);
      for (let i = 0; i < 1024; i++){
        const x = i * 2 / 1024 - 1;
        curve[i] = Math.tanh(2.2 * x) / Math.tanh(2.2);
      }
      sat.curve = curve; sat.oversample = '2x';
      sat.connect(this.bus);

      const ln = ac.sampleRate * 2;
      this.noise = ac.createBuffer(1, ln, ac.sampleRate);
      const nd = this.noise.getChannelData(0);
      for (let i = 0; i < ln; i++) nd[i] = Math.random() * 2 - 1;

      this.ready = true;
      return true;
    } catch (e){ return false; }
  },

  toggle(){
    this.on = !this.on; this.touched = true;
    if (this.on){ this.boot(); this.resume(); this.blip(680, 0.09, 0.18, 'triangle', 900); }
    this.save();
  },
  resume(){ if (this.ac && this.ac.state === 'suspended') this.ac.resume(); },
  suspend(){ if (this.ac && this.ac.state === 'running') this.ac.suspend(); },

  gate(cost){
    if (!this.on || !this.ready) return false;
    const t = this.ac.currentTime;
    if (t !== this.last){ this.voices = Math.max(0, this.voices - 8); this.last = t; }
    if (this.voices > 30) return false;
    this.voices += (cost || 1);
    return true;
  },

  /* one panner per sound, splitting to dry and to the room */
  route(node, pan, send, satur){
    const ac = this.ac;
    const pn = ac.createStereoPanner ? ac.createStereoPanner() : null;
    const head = pn || ac.createGain();
    if (pn) pn.pan.value = clamp(pan || 0, -1, 1);
    node.connect(head);
    const dry = ac.createGain(); dry.gain.value = 1 - (send || 0) * 0.35;
    head.connect(dry); dry.connect(satur ? this.sat : this.bus);
    if (send > 0){
      const sd = ac.createGain(); sd.gain.value = send;
      head.connect(sd); sd.connect(this.wet);
    }
    return head;
  },

  env(g, t, a, hold, rel, peak){
    g.setValueAtTime(0.0001, t);
    g.linearRampToValueAtTime(Math.max(0.0002, peak), t + a);
    g.setValueAtTime(Math.max(0.0002, peak), t + a + hold);
    g.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
  },

  blip(freq, dur, vol, type, slideTo, pan, send){
    if (!this.gate(1)) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    this.env(g.gain, t, 0.004, dur * 0.2, dur, vol);
    o.connect(g); this.route(g, pan, send || 0, false);
    o.start(t); o.stop(t + dur + 0.1);
  },

  /* filtered noise: the body of every impact */
  hiss(o){
    if (!this.gate(o.cost || 1)) return;
    const ac = this.ac, t = ac.currentTime + (o.at || 0);
    const src = ac.createBufferSource();
    src.buffer = this.noise;
    src.playbackRate.value = 0.75 + Math.random() * 0.6;
    const f = ac.createBiquadFilter();
    f.type = o.type; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f0, t);
    if (o.f1) f.frequency.exponentialRampToValueAtTime(Math.max(30, o.f1), t + o.dur);
    const g = ac.createGain();
    this.env(g.gain, t, o.attack || 0.002, o.dur * (o.hold || 0.08), o.dur, o.vol);
    src.connect(f); f.connect(g);
    this.route(g, o.pan, o.send || 0, o.sat);
    src.start(t); src.stop(t + o.dur + 0.1);
  },

  /* ---- the game ---- */

  land(size){
    const t = this.ac ? this.ac.currentTime : 0;
    if (t - (this.landAt || -9) < 0.055) return;
    this.landAt = t;
    const s = clamp(size || 0.4, 0, 1);
    this.blip(470 - s * 120, 0.13, 0.15, 'sine', 240, 0, 0.14);
    this.hiss({ dur:0.10, vol:0.13, type:'bandpass', f0:1500 - s*400, f1:520, q:0.8, send:0.12 });
  },

  merge(units){
    const step = Math.min(11, Math.log2(Math.max(2, units)));
    const f = 392 * Math.pow(2, step / 7);
    this.blip(f, 0.22, 0.13, 'triangle', f * 1.5, 0, 0.20);
    this.blip(f * 2, 0.13, 0.045, 'sine', 0, 0, 0.20);
  },

  /* A duck going over. A knock, then a reward that climbs a step for every
     duck taken inside a second and a bit, so a run of them pays off. */
  duck(){
    const t = this.ac ? this.ac.currentTime : 0;
    if (t - (this.duckAt || -9) > 1.25) this.duckN = 0;
    this.duckAt = t;
    const SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19];
    const n = Math.min(SCALE.length - 1, this.duckN || 0);
    this.duckN = (this.duckN || 0) + 1;
    const f = 620 * Math.pow(2, SCALE[n] / 12);
    const pan = (Math.random() * 2 - 1) * 0.4;
    this.hiss({ dur:0.05, vol:0.17, type:'lowpass', f0:1600, f1:420, q:0.8, pan, send:0.10 });
    this.blip(f, 0.22, 0.16, 'triangle', f, pan, 0.32);
    this.blip(f * 2, 0.17, 0.055, 'sine', 0, pan, 0.32);
    this.hiss({ dur:0.24, vol:0.05, type:'highpass', f0:5200, f1:8200, q:0.6,
                attack:0.012, at:0.02, pan, send:0.45, cost:0 });
  },

  edge(){
    const t = this.ac ? this.ac.currentTime : 0;
    if (t - (this.edgeAt || -9) < 0.09) return;
    this.edgeAt = t;
    this.blip(360, 0.17, 0.16, 'sine', 165, 0, 0.24);
    this.hiss({ dur:0.06, vol:0.09, type:'bandpass', f0:900, f1:400, q:1.2, send:0.2 });
  },

  /* ------------------------------------------------------------------
     The explosion, when a word goes up.

     MIXED FOR A PHONE SPEAKER. The first version put most of its energy
     in a sub falling to 26Hz and a rumble at 62Hz, which a phone simply
     cannot move air at, so on a handset it was nearly silent while the
     fireworks sat right in the speaker's best octave. The weight now
     lives between 400Hz and 4kHz where a phone is loudest, and the sub
     is doubled at its second and third harmonics so the ear infers the
     fundamental the speaker cannot produce.
     ------------------------------------------------------------------ */
  boom(scale){
    const k = clamp(scale || 1, 0.4, 2.2);
    const now = this.ac ? this.ac.currentTime : 0;
    if (now - this.lastBoom < 0.04) return;
    if (!this.gate(6)) return;
    this.lastBoom = now;

    const pan = (Math.random() * 2 - 1) * 0.55;
    const jt = 1 + (Math.random() - 0.5) * 0.22;

    // 1. shock front, right in the middle of what a phone can shout
    this.hiss({ dur:0.026*k, vol:0.52*k, type:'highpass', f0:520, f1:1700,
                q:0.4, attack:0.0005, hold:0.02, pan, send:0.16 });
    // 2. the crack
    this.hiss({ dur:0.12*k*jt, vol:0.40*k, type:'bandpass', f0:3000, f1:1200,
                q:0.9, attack:0.001, pan, send:0.26 });
    // 3. the body: the whump, and the loudest thing here
    this.hiss({ dur:0.62*k*jt, vol:0.76*k, type:'bandpass', f0:1350, f1:165,
                q:0.75, attack:0.004, at:0.004, pan, send:0.44, sat:true, cost:0 });
    // 4. the drop, written as a fundamental plus two harmonics. Headphones
    //    hear the bottom octave; a phone hears the harmonics and infers it.
    const t = this.ac.currentTime;
    for (const [f0, f1, d, v] of [[132, 34, 1.15*k, 0.34*k],
                                  [264, 68, 0.90*k, 0.36*k],
                                  [396, 102, 0.58*k, 0.19*k]]){
      const o = this.ac.createOscillator(), g = this.ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0 * jt, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + d);
      this.env(g.gain, t, 0.003, 0.02, d, v);
      o.connect(g); this.route(g, pan, 0.26, true);
      o.start(t); o.stop(t + d + 0.12);
    }
    // 5. debris
    this.hiss({ dur:0.70*k, vol:0.075*k, type:'highpass', f0:1800, f1:5000,
                q:0.5, attack:0.025, at:0.04, pan, send:0.5, cost:0 });
    // 6. rumble, lifted into the range a handset can actually reach
    this.hiss({ dur:1.65*k, vol:0.54*k, type:'bandpass', f0:400, f1:135,
                q:0.7, attack:0.26*k, hold:0.16, at:0.02, pan, send:0.55, cost:0 });
    this.hiss({ dur:2.40*k, vol:0.50*k, type:'bandpass', f0:180, f1:68,
                q:0.6, attack:0.60*k, hold:0.16, at:0.08, pan, send:0.65, cost:0 });
  },

  charge(dur){
    if (!this.gate(2)) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(68, t);
    o.frequency.exponentialRampToValueAtTime(700, t + dur);
    const lp = this.ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.Q.value = 7;
    lp.frequency.setValueAtTime(280, t);
    lp.frequency.exponentialRampToValueAtTime(4400, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.15, t + dur * 0.86);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.14);
    o.connect(lp); lp.connect(g); this.route(g, 0, 0.3, false);
    o.start(t); o.stop(t + dur + 0.25);
  },
};
SFX.load();

/* ------------------------------------------------------------
   Loop
   ------------------------------------------------------------ */
let last = 0, fpsAcc = 0, fpsN = 0, fpsT0 = 0, lastDt = 0.016;

function frame(now){
  requestAnimationFrame(frame);
  if (!running) return;
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1/20) dt = 1/20;
  if (dt <= 0) return;
  clock += dt;
  lastDt = dt;

  if (!fpsT0) fpsT0 = now;
  fpsN++;
  fpsAcc = (now - fpsT0) / 1000;
  if (fpsAcc > 1.2){
    const fps = fpsN / fpsAcc;
    quality = fps < 48 ? 0 : (fps > 56 ? 1 : quality);
    const wasSmooth = smoothStars;
    if (fps < 40) smoothStars = false;
    else if (fps > 50) smoothStars = true;
    if (smoothStars !== wasSmooth) bgDirty = true;
    if (resHold > 0) resHold--;
    else if (fps < 34 && resStep < RES_LADDER.length - 1){ resStep++; resHold = 2; resize(); }
    else if (fps > 52 && resStep > 0){ resStep--; resHold = 7; resize(); }
    fpsT0 = now; fpsN = 0;
  }

  if (reload > 0) reload -= dt;
  if (hintAlpha < 0) hintAlpha = 0;
  else if (hintAlpha > 0 && shotsFired >= 2) hintAlpha = Math.max(0, hintAlpha - dt * 0.8);
  if (shake > 0) shake = Math.max(0, shake - dt * 42);
  if (edgeFlash.t > 0) edgeFlash.t -= dt;

  updatePull();
  updateDucks(dt);
  updateJoy(dt);
  updateShells(dt);
  updateFinale(dt);
  if (victoryT > 0){ victoryT -= dt; bgDirty = true; }
  if (flash > 0) flash = Math.max(0, flash - dt * 1.55);

  const steps = Math.min(5, Math.ceil(dt / (1/150)));
  const sdt = dt / steps;
  links.length = 0;
  for (let i = 0; i < steps; i++) physics(sdt, i === steps - 1);
  duckHits();

  for (const b of bodies){
    if (b.pop > 0) b.pop = Math.max(0, b.pop - dt * 3.2);
    if (b.dying > 0){ b.dying -= dt; if (b.dying <= 0) b.dead = true; }
  }
  bodies = bodies.filter(b => !b.dead);

  for (const p of particles){
    const k = p.k || 0;
    if (k === 2){                       // fire rises and swells
      p.vz += 130 * dt;
      const drag = 1 / (1 + 3.4 * dt);
      p.vx *= drag; p.vy *= drag; p.vz *= drag;
    } else if (k === 1){                // sparks are light and drag hard
      p.vz -= K.GRAV * 0.85 * dt;
      const drag = 1 / (1 + 2.6 * dt);
      p.vx *= drag; p.vy *= drag;
    } else if (k === 4){                // confetti: light, draggy, fluttering
      p.vz -= K.GRAV * 0.10 * dt;
      if (p.vz < -p.term) p.vz = -p.term;
      const drag = 1 / (1 + 2.9 * dt);
      p.vx *= drag; p.vy *= drag;
      p.sway += p.sw * dt;
      p.flip += p.fs * dt;
      p.x += Math.sin(p.sway) * p.amp * dt;
      p.y += Math.cos(p.sway * 0.7) * p.amp * 0.45 * dt;
    } else if (k === 3){                // firework stars hang in the air
      p.vz -= K.GRAV * 0.30 * dt;
      const drag = 1 / (1 + 1.5 * dt);
      p.vx *= drag; p.vy *= drag; p.vz *= drag;
    } else {
      p.vz -= K.GRAV * 0.45 * dt;
    }
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    if (p.z < 0){
      p.z = 0;
      if (k === 2){ p.vz = 0; }
      else if (k === 4){ p.vz = 0; p.vx *= 0.55; p.vy *= 0.55; p.amp *= 0.5;
                         if (p.t > 1.1) p.t = 1.1; }
      else { p.vz *= -0.3; p.vx *= 0.7; p.vy *= 0.7; }
    }
    p.t -= dt;
  }
  particles = particles.filter(p => p.t > 0);
  for (const r of rings) r.t -= dt;
  rings = rings.filter(r => r.t > 0);
  for (const p of pops) p.t -= dt;
  pops = pops.filter(p => p.t > 0);

  draw();
}

/* ------------------------------------------------------------
   Input
   ------------------------------------------------------------ */
function reset(){
  bodies = []; particles = []; rings = []; pops = []; links = [];
  score = 0; shotsFired = 0; upcoming = 0;
  power = 0; aimYaw = 0; reload = 0; shake = 0; hintAlpha = 1;
  pull.on = false; pull.keys = false;
  victory = 0; victoryT = 0; finale = null; flash = 0; shells = [];
  JOY.tx = JOY.ty = JOY.vx = JOY.vy = 0; JOY.flare = 0;
  buildDucks();
}

const held = {};
function bind(){
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    SFX.wake();
    const sh = SFX.hit;
    if (sh && e.clientX >= sh.x - 6 && e.clientX <= sh.x + sh.w + 6 &&
             e.clientY >= sh.y - 6 && e.clientY <= sh.y + sh.h + 6){ SFX.toggle(); return; }
    if (finale && finale.phase === 'done'){ reset(); return; }
    if (e.clientX > VW - 46 - SAFE.r && e.clientY < 46 + SAFE.t){ reset(); return; }
    cv.setPointerCapture && cv.setPointerCapture(e.pointerId);
    pull.on = true; pull.keys = false;
    pull.ax = pull.x = e.clientX;
    pull.ay = pull.y = e.clientY;
    power = 0;
  }, { passive:false });

  cv.addEventListener('pointermove', e => {
    if (!pull.on) return;
    pull.x = e.clientX; pull.y = e.clientY;
  }, { passive:true });

  const release = () => {
    if (!pull.on) return;
    pull.on = false;
    fire();
    power = 0;
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', () => { pull.on = false; power = 0; });
  cv.addEventListener('contextmenu', e => e.preventDefault());

  addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r'){ reset(); return; }
    if (['ArrowLeft','ArrowRight','KeyA','KeyD','Space'].includes(e.code)){
      held[e.code] = true;
      if (e.code === 'Space'){ pull.keys = true; pull.on = false; }
      e.preventDefault();
    }
  });
  addEventListener('keyup', e => {
    held[e.code] = false;
    if (e.code === 'Space' && pull.keys){ fire(); power = 0; pull.keys = false; e.preventDefault(); }
  });
  setInterval(() => {
    const d = 1/60;
    if (held.ArrowLeft  || held.KeyA) aimYaw = clamp(aimYaw - 1.3*d, -K.YAW_LIMIT, K.YAW_LIMIT);
    if (held.ArrowRight || held.KeyD) aimYaw = clamp(aimYaw + 1.3*d, -K.YAW_LIMIT, K.YAW_LIMIT);
    if (pull.keys && held.Space) power = clamp(power + d * 0.62, 0, 1);
  }, 16);

  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 120));
}

/* ------------------------------------------------------------
   Boot. The game is live the moment the page paints.
   ------------------------------------------------------------ */
cv = document.getElementById('c');
ctx = cv.getContext('2d', { alpha:false });
resize();
bind();
requestAnimationFrame(frame);
</script>
