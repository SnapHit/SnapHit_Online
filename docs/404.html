<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    display:grid;place-items:center;text-align:center;padding:9vw;
    background:radial-gradient(80% 60% at 50% 38%,#0b2138,#02040a 72%);
    color:#cfe2f5;font:400 15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  .code{
    font:900 clamp(56px,17vw,120px)/1 "Arial Black",Impact,system-ui,sans-serif;
    color:#ff9424;text-shadow:0 0 30px rgba(255,148,36,.6);letter-spacing:.02em;
  }
  p{margin-top:14px;color:#7e93ab;font-size:14px}
  a{
    display:inline-block;margin-top:26px;padding:12px 20px;border-radius:999px;
    text-decoration:none;background:radial-gradient(circle at 34% 26%,#ffd9a2,#ff9424 58%,#a04d06);
    color:#2a1402;font-weight:800;font-size:11px;letter-spacing:.18em;
    box-shadow:0 0 0 1px rgba(255,214,150,.6),0 6px 18px -6px rgba(255,148,36,.8);
  }
  .glyph{display:block;width:62px;height:58px;margin:48px auto 14px;
    filter:drop-shadow(0 0 10px rgba(0,229,255,.55))}
  .sub{display:block;margin-top:12px;font-size:13px;font-weight:800;
    letter-spacing:.26em;color:#ffd9a2;opacity:.8}
  .wm{display:block;width:min(216px,60vw);height:auto;margin:0 auto;
    filter:drop-shadow(0 0 5px rgba(255,148,36,.9)) drop-shadow(0 0 20px rgba(255,148,36,.3))}
  .tag{display:block;margin-top:13px;font-size:12px;font-weight:800;
    letter-spacing:.26em;word-spacing:.9em;color:#ff9424}
  .tag i{font-style:normal;margin-left:-.24em;letter-spacing:.26em}
</style>
</head>
