<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manta lab</title>
<!-- An empty data URL, so the browser never asks for /favicon.ico. A data:
     URL is not a request; a missing favicon is a 404 in the log. -->
<link rel="icon" href="data:,">

<!--
  Manta trains: the look spike. Not part of the site.

  Nothing links here. No entry in the GAMES array, no line in sitemap.xml, no
  change to robots.txt, and noindex/nofollow above.

  It began as the diagnostics page from Brief 0 and still is one: which backend
  is live, what the library costs to load, what the refresh rate really is. The
  panel is collapsed to a chip now, because the spike is judged by eye and the
  default view has to be almost all ocean.

  Everything is same-origin. The import map is the only way Three.js gets
  loaded, and the page's own modules are plain relative imports beside this
  file: no CDN, no bundler, no build step. Zero external requests.
-->

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  /* The ocean, painted in CSS before a single byte of JavaScript runs, in the
     same colours the shader starts from. Three hundred to four hundred
     milliseconds pass before the first frame, and a black rectangle for a
     third of a second is the difference between "it is loading" and "it is
     broken". When the canvas does come up it replaces like with like. */
  body {
    background: linear-gradient(180deg, #060b14 0%, #040711 55%, #02040a 100%);
    font: 400 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    color: #e8eef5;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  #gl { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  /* ---- the chip: what you see by default ---- */
  #chip {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    z-index: 3;
    display: flex; align-items: center; gap: 8px;
    min-height: 34px; padding: 0 12px;
    font: inherit; font-size: 13px; font-weight: 600;
    color: #bfeee3;
    background: rgba(4,9,18,.55);
    border: 1px solid rgba(120,190,210,.30);
    border-radius: 999px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #7fe3d0; }
  #chip.webgl2 { color: #ffd9a8; } #chip.webgl2 .dot { background: #ffc46b; }
  #chip.failed { color: #ffb3ab; } #chip.failed .dot { background: #ff8a80; }
  #chip .fps { color: #8fa6bb; font-weight: 400; font-variant-numeric: tabular-nums; }

  /* ---- the panel: everything, once you ask for it ---- */
  #panel {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 54px);
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
    z-index: 2;
    max-height: calc(100% - 200px - env(safe-area-inset-top, 0px));
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    margin: 0 10px;
    padding: 12px 14px 14px;
    border: 1px solid rgba(120,190,210,.28);
    border-radius: 12px;
    background: rgba(4,9,18,.86);
  }
  #panel[hidden], #bar[hidden] { display: none; }

  #backend { font-size: 26px; font-weight: 700; line-height: 1.1; margin: 0 0 2px; color: #7fe3d0; }
  #backend.webgl2 { color: #ffc46b; }
  #backend.failed { color: #ff8a80; }
  #sub { margin: 0 0 10px; font-size: 14px; color: #9fb4c7; }

  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 0; }
  dt { color: #8fa6bb; white-space: nowrap; }
  dd { margin: 0; word-break: break-word; }
  .num { font-variant-numeric: tabular-nums; }
  #rows dd.block {
    white-space: pre; overflow-x: auto;
    font: 400 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  #err {
    display: none; margin: 0 0 12px; padding: 9px 10px;
    border-radius: 8px; background: rgba(120,20,20,.55);
    border: 1px solid #ff8a80; color: #ffd9d4; font-size: 14px;
    white-space: pre-wrap; word-break: break-word;
  }
  #err.on { display: block; }
  /* A fallback that worked is not a failure. Amber, and the headline stays the
     name of the backend that is actually drawing. Capped and scrollable: a
     stack trace is ten lines, and unbounded it pushed every diagnostic row off
     a phone screen. Copy report reads the text, not the visible part. A red
     #err is not capped, because when nothing draws there is nothing else. */
  #err.note {
    background: rgba(90,62,10,.5); border-color: #ffc46b; color: #ffe6bd;
    max-height: 7.5em; overflow-y: auto;
  }

  #bar {
    position: fixed; z-index: 3;
    left: env(safe-area-inset-left, 0px);
    right: env(safe-area-inset-right, 0px);
    bottom: env(safe-area-inset-bottom, 0px);
    display: flex; flex-wrap: wrap; gap: 10px; margin: 10px;
  }
  #bar button {
    flex: 1 1 calc(50% - 5px); min-height: 48px;
    font: inherit; font-size: 16px; font-weight: 600;
    color: #04060d; background: #7fe3d0;
    border: 0; border-radius: 10px; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  #bar button:active { transform: translateY(1px); }
  #bar button.ghost {
    background: rgba(127,227,208,.14); color: #bfeee3;
    box-shadow: inset 0 0 0 1px rgba(127,227,208,.45);
  }

  @media (orientation: landscape) and (max-height: 520px) {
    #panel { max-width: 56%; max-height: calc(100% - 74px - env(safe-area-inset-top, 0px)); }
    #bar { left: auto; width: 40%; }
    #bar button { min-height: 40px; font-size: 14px; }
    #backend { font-size: 22px; }
  }

  #plain {
    position: fixed; left: 10px; right: 10px; top: 10px;
    height: 60%; display: none; z-index: 5;
    font: 400 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: #e8eef5; background: #060c17;
    border: 1px solid #7fe3d0; border-radius: 10px; padding: 10px;
  }
  #plain.on { display: block; }
</style>
</head>
<body>

<canvas id="gl"></canvas>

<button id="chip" type="button" aria-expanded="false" aria-controls="panel">
  <span class="dot" aria-hidden="true"></span>
  <span id="chipBackend">starting…</span>
  <span class="fps" id="chipFps">—</span>
</button>

<div id="panel" hidden>
  <!-- Headline first, then the one line that says what to do about it, then
       the detail. A stack trace is long, and burying "which backend" under it
       loses the answer the page exists to give. -->
  <p id="backend">starting…</p>
  <p id="sub">loading Three.js from /vendor/three/r186/</p>
  <div id="err"></div>
  <dl id="rows"></dl>
</div>

<div id="bar" hidden>
  <button id="swap" type="button">Switch backend</button>
  <button id="copy" type="button" class="ghost">Copy report</button>
  <button id="cold" type="button" class="ghost">Cold load</button>
  <button id="warm" type="button" class="ghost">Warm load</button>
</div>

<textarea id="plain" readonly></textarea>

<script>
/* Classic script, on purpose, and first. It runs before any module is fetched,
   so a module that fails to parse, fails to resolve through the import map or
   throws on init still lands in the panel instead of leaving a black screen
   with nothing on it. */
(function () {
  var box = document.getElementById('err');
  var seen = {}, shown = 0;
  function open() {
    /* A failure has to be visible even when the panel is collapsed, because
       the chip alone cannot carry a stack trace. */
    document.getElementById('panel').hidden = false;
    document.getElementById('bar').hidden = false;
    document.getElementById('chip').setAttribute('aria-expanded', 'true');
  }
  window.__labError = function (what, e) {
    var msg = (e && (e.stack || e.message)) ? (e.stack || e.message) : String(e);
    var line = what + ': ' + msg;
    /* A renderer that throws throws every frame. Reporting each one would bury
       the first, which is the only one that says anything. */
    if (seen[line]) return;
    seen[line] = true;
    if (shown < 4) { box.textContent = (box.textContent ? box.textContent + '\n\n' : '') + line; shown++; }
    box.className = 'on';
    var b = document.getElementById('backend');
    b.textContent = b.dataset.name ? (b.dataset.name + ' · FAILED') : 'FAILED';
    b.className = 'failed';
    document.getElementById('chip').className = 'failed';
    document.getElementById('chipBackend').textContent = 'FAILED';
    open();
  };
  /* A handled failure the page recovered from. Same box, amber, headline left
     alone: after an automatic fallback the headline names the backend that is
     drawing, not the one that died. */
  window.__labNote = function (what, e) {
    var msg = (e && (e.stack || e.message)) ? (e.stack || e.message) : String(e);
    var line = what + ': ' + msg;
    if (seen[line]) return;
    seen[line] = true;
    box.textContent = (box.textContent ? box.textContent + '\n\n' : '') + line;
    if (box.className !== 'on') box.className = 'on note';
  };
  window.addEventListener('error', function (e) { window.__labError('uncaught error', e.error || e.message); });
  window.addEventListener('unhandledrejection', function (e) { window.__labError('unhandled rejection', e.reason); });
})();
</script>

<script>
/* The import map, built here rather than written out, and still the only way
   Three.js is loaded. A document may have one import map and it has to exist
   before the first module is fetched, so this is a classic inline script: it
   blocks the parser, and the module tag below is not reached until the map is
   in the document.

   ?cold=<stamp> puts a fresh query on the three build files so the browser has
   to go to the network for them. That turns a cold measurement into one tap
   instead of an incognito window.

   three.core.js needs a key of its own. three.webgpu.js reaches it by the
   relative specifier './three.core.js', which never sees a bare-specifier
   mapping, and a query string is not inherited across relative resolution.
   Import maps do remap URL-like specifiers, so the resolved path is listed as
   a key and sent to the stamped copy. Without this line a "cold" load would
   quietly serve 1.4 MB of the 3.7 MB out of cache and under-report itself.

   This page's own modules sit beside this file and are imported by relative
   path, so they need no entry here and get none. addons/ is untouched for the
   same reason: nothing imports from it. */
(function () {
  var BASE = '/vendor/three/r186/';
  var stamp = new URLSearchParams(location.search).get('cold');
  var q = stamp ? '?cold=' + encodeURIComponent(stamp) : '';
  var imports = {
    'three':         BASE + 'three.webgpu.js' + q,
    'three/webgpu':  BASE + 'three.webgpu.js' + q,
    'three/tsl':     BASE + 'three.tsl.js' + q,
    'three/addons/': BASE + 'addons/'
  };
  if (q) imports[BASE + 'three.core.js'] = BASE + 'three.core.js' + q;
  /* The 'three/addons/' prefix mapping cannot carry a query, so a cold load
     would quietly serve the two addons this page imports out of cache. Import
     maps prefer the most specific key, so name them. */
  if (q) for (const a of ['tsl/display/BloomNode.js', 'tsl/display/CRT.js']) {
    imports['three/addons/' + a] = BASE + 'addons/' + a + q;
  }
  var el = document.createElement('script');
  el.type = 'importmap';
  el.textContent = JSON.stringify({ imports: imports });
  document.head.appendChild(el);
})();
</script>

<script type="module" src="./main.js"></script>
</body>
</html>
