<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manta rooms probe</title>
<!-- An empty data URL, so the browser never asks for /favicon.ico. -->
<link rel="icon" href="data:,">
<!--
  The rooms probe (brief 3A). One WebSocket to the rooms Worker's echo on
  this same host, fifty timestamped pings one after another, and the round
  trips they took. Same-origin only: no request leaves snap-hit.online.
  Unlinked and noindex, like the lab page it sits under.
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; padding: 20px 16px 32px;
    background: linear-gradient(180deg, #060b14 0%, #040711 55%, #02040a 100%);
    color: #d8e6f5; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
  .sub { margin: 0 0 18px; color: #8ea3bb; font-size: 14px; }
  #state {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin-bottom: 16px;
    border: 1px solid rgba(160,190,230,.18); border-radius: 12px; background: rgba(4,9,18,.6);
    font-weight: 600;
  }
  #state .dot { width: 10px; height: 10px; border-radius: 50%; background: #8ea3bb; flex: none; }
  #state.ok .dot { background: #7fe3d0; } #state.ok { color: #bdf3e8; }
  #state.bad .dot { background: #ff8a80; } #state.bad { color: #ffc2bb; }
  #state.busy .dot { background: #ffc46b; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0 0 18px; }
  dt { color: #8ea3bb; }
  dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .big dd { font-size: 20px; font-weight: 650; }
  .big dt { align-self: center; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .pick { margin-bottom: 14px; }
  .pick button[aria-pressed="true"] { background: rgba(127,227,208,.22); border-color: #7fe3d0; color: #bdf3e8; }
  button {
    font: inherit; font-weight: 600; color: #d8e6f5; padding: 10px 16px; min-height: 44px;
    border-radius: 10px; border: 1px solid rgba(160,190,230,.35); background: rgba(40,70,110,.35);
  }
  button:disabled { opacity: .5; }
  #plain {
    display: none; width: 100%; height: 11em; margin-top: 14px; color: #d8e6f5;
    background: rgba(4,9,18,.8); border: 1px solid rgba(160,190,230,.3); border-radius: 8px;
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace;
  }
  #plain.on { display: block; }
  .foot { margin-top: 22px; color: #6f8499; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Rooms probe</h1>
  <p class="sub">Fifty pings to the rooms server on this site, one after another.</p>

  <div class="row pick" role="group" aria-label="What to measure">
    <button id="pickEdge" type="button" aria-pressed="true">Edge echo</button>
    <button id="pickRoom" type="button" aria-pressed="false">Room echo</button>
  </div>

  <div id="state" class="busy"><span class="dot"></span><span id="stateText">starting…</span></div>

  <dl class="big">
    <dt>median</dt><dd id="median">—</dd>
    <dt>95th percentile</dt><dd id="p95">—</dd>
  </dl>
  <dl>
    <dt>worst</dt><dd id="worst">—</dd>
    <dt>best</dt><dd id="best">—</dd>
    <dt>pings</dt><dd id="count">—</dd>
    <dt>connect</dt><dd id="connect">—</dd>
    <dt>connection</dt><dd id="conn">—</dd>
    <dt>measured</dt><dd id="which">—</dd>
    <dt>address</dt><dd id="addr">—</dd>
  </dl>

  <div class="row">
    <button id="again" type="button">Run again</button>
    <button id="copy" type="button">Copy results</button>
  </div>
  <textarea id="plain" readonly></textarea>

  <p class="foot">build <span id="build"></span></p>
</main>

<script>
'use strict';
/* Bumped by hand whenever this page changes, so a stale deploy is obvious. */
const BUILD = '2026-09-26 06:32 UTC';
const PINGS = 50;
/* Two things to measure: the Worker's own echo at the edge, and a room, the
   Durable Object named "probe", which is what live rooms will run on. */
const TARGETS = {
  edge: { label: 'edge echo', path: '/lab/manta/rooms/echo' },
  room: { label: 'room echo (room "probe")', path: '/lab/manta/rooms/room/probe' },
};
let target = 'edge';
/* Per step, never for the whole run: fifty pings on a slow phone link can
   take far longer than any fixed total, and that is what this measures. */
const CONNECT_MS = 10000, PING_MS = 5000;

const $ = id => document.getElementById(id);
$('build').textContent = BUILD;
const urlOf = path => (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + path;

let last = null;          // the latest run's results, for Copy
let running = false;

function state (text, cls) {
  $('stateText').textContent = text;
  $('state').className = cls;
}
const ms = v => (v == null || !isFinite(v)) ? '—' : v.toFixed(1) + ' ms';
/* The middle of the sorted pings, averaging the two middles of an even count. */
function median (sorted) {
  const n = sorted.length;
  if (!n) return null;
  return n % 2 ? sorted[(n - 1) / 2] : (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
}
/* Nearest rank: the value at or below which p of the pings fall. */
function rank (sorted, p) {
  if (!sorted.length) return null;
  return sorted[Math.min(sorted.length - 1, Math.max(0, Math.ceil(p * sorted.length) - 1))];
}

/* What the browser says about the connection, where it says anything. */
function connection () {
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (!c) return 'not exposed by this browser';
  const bits = [];
  if (c.type) bits.push(c.type);
  if (c.effectiveType) bits.push('effective ' + c.effectiveType);
  if (typeof c.downlink === 'number') bits.push(c.downlink + ' Mbit/s down');
  if (typeof c.rtt === 'number') bits.push('browser estimate ' + c.rtt + ' ms');
  if (c.saveData) bits.push('data saver on');
  return bits.length ? bits.join(', ') : 'exposed, but empty';
}

function show (r) {
  const sorted = r.rtts.slice().sort((a, b) => a - b);
  r.median = median(sorted); r.p95 = rank(sorted, 0.95);
  r.best = sorted.length ? sorted[0] : null; r.worst = sorted.length ? sorted[sorted.length - 1] : null;
  $('median').textContent = ms(r.median);
  $('p95').textContent = ms(r.p95);
  $('worst').textContent = ms(r.worst);
  $('best').textContent = ms(r.best);
  $('count').textContent = r.rtts.length + ' of ' + PINGS;
  $('connect').textContent = ms(r.connectMs);
  $('conn').textContent = r.connection;
}

function finish (r, text, cls) {
  if (r.done) return;
  r.done = true; clearTimeout(r.timer);
  r.outcome = text;
  state(text, cls);
  show(r);
  last = r; running = false;
  $('again').disabled = false;
  try { r.ws.close(1000, 'done'); } catch (e) { /* already closed */ }
}

/* A refused WebSocket tells the page nothing about why, so ask the same
   path over plain HTTP: 503 is the rooms off switch, anything else is
   reported as it came back. */
async function diagnose (r) {
  let text = 'could not connect';
  try {
    const res = await fetch(r.path, { cache: 'no-store' });
    let body = (await res.text()).trim();
    body = body.startsWith('<') ? '' : body.slice(0, 80);   // a page, not a message
    text = res.status === 503 ? 'rooms are off' : 'could not connect: HTTP ' + res.status + (body ? ' ' + body : '');
  } catch (e) {
    text = 'could not connect: ' + (e && e.message ? e.message : 'network error');
  }
  finish(r, text, 'bad');
}

function run () {
  if (running) return;
  running = true; $('again').disabled = true;
  $('plain').className = '';
  const t = TARGETS[target];
  const r = { rtts: [], connectMs: null, connection: connection(), done: false, opened: false,
              label: t.label, path: t.path, url: urlOf(t.path),
              when: new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC' };
  $('which').textContent = r.label;
  $('addr').textContent = r.url;
  show(r);
  state('connecting…', 'busy');
  const t0 = performance.now();
  const arm = (limit, text) => { clearTimeout(r.timer); r.timer = setTimeout(() => finish(r, text, 'bad'), limit); };
  const send = i => {
    arm(PING_MS, 'no answer to ping ' + (i + 1) + ' in ' + PING_MS / 1000 + ' s');
    r.ws.send(JSON.stringify({ i, t: performance.now() }));
  };
  try { r.ws = new WebSocket(r.url); } catch (e) { finish(r, 'could not connect: ' + e.message, 'bad'); return; }
  arm(CONNECT_MS, 'timed out connecting after ' + CONNECT_MS / 1000 + ' s');
  r.ws.onopen = () => {
    r.opened = true; r.connectMs = performance.now() - t0;
    state('connected · pinging…', 'busy');
    send(0);
  };
  r.ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (typeof m.t !== 'number' || m.i !== r.rtts.length) return;
    r.rtts.push(performance.now() - m.t);
    if (r.rtts.length % 5 === 0) show(r);
    if (r.rtts.length < PINGS) send(r.rtts.length);
    else finish(r, 'connected · ' + PINGS + ' round trips', 'ok');
  };
  r.ws.onclose = ev => {
    if (r.done) return;
    if (!r.opened) diagnose(r);
    else finish(r, 'closed early after ' + r.rtts.length + ' pings (code ' + ev.code + ')', 'bad');
  };
}

function report () {
  const r = last;
  if (!r) return 'Rooms probe: no run yet';
  return ['Rooms probe — ' + r.label + ' — ' + r.outcome,
    'median ' + ms(r.median) + ' · p95 ' + ms(r.p95) + ' · worst ' + ms(r.worst) + ' · best ' + ms(r.best),
    'pings ' + r.rtts.length + ' of ' + PINGS + ' · connect ' + ms(r.connectMs),
    'connection: ' + r.connection,
    'measured: ' + r.label, 'when: ' + r.when, 'address: ' + r.url, 'build: ' + BUILD,
    'browser: ' + navigator.userAgent].join('\n');
}

$('again').addEventListener('click', run);
/* Choosing what to measure runs it, unless a run is already going. */
function pick (which) {
  if (running) return;
  target = which;
  $('pickEdge').setAttribute('aria-pressed', String(which === 'edge'));
  $('pickRoom').setAttribute('aria-pressed', String(which === 'room'));
  run();
}
$('pickEdge').addEventListener('click', () => pick('edge'));
$('pickRoom').addEventListener('click', () => pick('room'));
$('copy').addEventListener('click', async () => {
  const text = report(), btn = $('copy');
  try {
    if (!navigator.clipboard) throw new Error('no clipboard');
    await navigator.clipboard.writeText(text);
    btn.textContent = 'Copied';
  } catch (e) {
    /* Put it on screen and select it instead, so a long press offers Copy. */
    const box = $('plain');
    box.value = text; box.className = 'on'; box.focus(); box.select();
    box.setSelectionRange(0, text.length);
    btn.textContent = 'Select and copy';
  }
  setTimeout(() => { btn.textContent = 'Copy results'; }, 2000);
});

run();
</script>
</body>
</html>
